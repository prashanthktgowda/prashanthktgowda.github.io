<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Prashantha K T</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --cyan: #00E5FF; --bg: #050A12; --muted: #6B7E9A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: #E8EDF5;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.5rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 8rem;
      font-weight: 900;
      color: var(--cyan);
      line-height: 1;
      opacity: 0.15;
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
    }
    p { color: var(--muted); font-size: 0.8rem; }
    a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.7rem 1.8rem;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.3s;
    }
    a:hover { background: rgba(0,229,255,0.1); }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Page not found</h2>
  <p>The page you're looking for doesn't exist.</p>
  <a href="/">Go Home</a>
</body>
</html>
